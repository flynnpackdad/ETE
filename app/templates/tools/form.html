{% extends "base.html" %}
{% block title %}{{ title }} · {{ config.APP_NAME }}{% endblock %}

{% block content %}
<div class="page-head">
  <div class="section-label">Tools</div>
  <h1>{{ title }}</h1>
</div>

<form method="post" class="card form-card">
  {{ form.hidden_tag() }}

  <label class="field">
    {{ form.name.label }}
    {{ form.name(class_="input", placeholder="e.g. Kubernetes, ServiceNow, Terraform") }}
    {% for e in form.name.errors %}<span class="field-error">{{ e }}</span>{% endfor %}
  </label>

  <label class="field">
    {{ form.service_id.label }}
    {{ form.service_id(class_="input") }}
    {% for e in form.service_id.errors %}<span class="field-error">{{ e }}</span>{% endfor %}
  </label>

  <label class="field">
    {{ form.vendor_id.label }}
    {{ form.vendor_id(class_="input") }}
    {% for e in form.vendor_id.errors %}<span class="field-error">{{ e }}</span>{% endfor %}
  </label>

  <label class="field">
    {{ form.cost_center_id.label }}
    {{ form.cost_center_id(class_="input") }}
    {% for e in form.cost_center_id.errors %}<span class="field-error">{{ e }}</span>{% endfor %}
  </label>

  <label class="field">
    {{ form.category_id.label }}
    {{ form.category_id(class_="input") }}
    {% for e in form.category_id.errors %}<span class="field-error">{{ e }}</span>{% endfor %}
  </label>

  <label class="field">
    {{ form.projected_cost.label }}
    {{ form.projected_cost(class_="input", placeholder="e.g. 1500.00") }}
    {% for e in form.projected_cost.errors %}<span class="field-error">{{ e }}</span>{% endfor %}
  </label>

  <label class="field">
    {{ form.cost_type.label }}
    {{ form.cost_type(class_="input") }}
    {% for e in form.cost_type.errors %}<span class="field-error">{{ e }}</span>{% endfor %}
  </label>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary btn-lg">Save Tool</button>
    <a class="btn btn-secondary" href="{{ url_for('tools.list_') }}">Cancel</a>
  </div>
</form>
{% endblock %}
