<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in · {{ config.APP_NAME }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23007AFF'/><text x='16' y='22' text-anchor='middle' fill='white' font-family='system-ui' font-weight='700' font-size='14'>E</text></svg>">
</head>
<body>
  <div class="login-page">
  <form class="card login-card" method="post" action="{{ url_for('auth.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="login-brand">
        <div class="login-brand-mark">ETE</div>
    <h1 class="login-title">Service Catalog</h1>
        <p class="login-sub">Sign in to continue</p>
</div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-stack" style="margin-bottom:16px;">
            {% for category, message in messages %}
              <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <label class="field">
        <span class="field-label">Username</span>
        <input type="text" name="username" class="input" autocomplete="username" placeholder="Enter your username" required autofocus>
      </label>

      <label class="field">
        <span class="field-label">Password</span>
        <input type="password" name="password" class="input" autocomplete="current-password" placeholder="Enter your password" required>
      </label>

      <button type="submit" class="btn btn-primary btn-block btn-lg">Sign in</button>
    </form>
  </div>
</body>
</html>
