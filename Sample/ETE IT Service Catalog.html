<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETE – IT Service Catalog 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --gl-orange: #FF8300;
  --gl-yellow: #F7B334;
  --gl-white: #FFFFFF;
  --gl-passion: #200F51;
  --gl-grape: #472BA4;
  --gl-lilac: #D1C1FF;
  --gl-bg-gradient: radial-gradient(ellipse at top right, #6B1800 0%, #3A0D5C 25%, #200F51 60%, #0A0620 100%);
  --gl-card-bg: rgba(255,255,255,0.06);
  --gl-card-border: 1.5px solid rgba(209,193,255,0.25);
  --gl-font-headline: 'Montserrat', 'Arial Black', sans-serif;
  --gl-font-body: 'Nunito', 'Helvetica Neue', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: #0A0620;
  color: var(--gl-white);
  font-family: var(--gl-font-body);
  overflow: hidden;
  user-select: none;
}

.deck {
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
}

.slide {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: var(--gl-bg-gradient);
  display: flex;
  flex-direction: column;
  padding: 44px 56px 76px;
  opacity: 0;
  transform: translateX(60px);
  transition: opacity 0.3s ease, transform 0.3s ease;
  pointer-events: none;
  overflow: hidden;
}

.slide.active {
  opacity: 1;
  transform: translateX(0);
  pointer-events: all;
}

.slide.exit-left {
  opacity: 0;
  transform: translateX(-60px);
  pointer-events: none;
}

/* ── Progress bar ─────────────────────────── */
#progressBar {
  position: fixed;
  top: 0; left: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--gl-orange), var(--gl-yellow));
  transition: width 0.3s ease;
  z-index: 200;
}

/* ── Bottom nav ───────────────────────────── */
.nav {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 200;
  background: rgba(10,6,32,0.88);
  border: 1px solid rgba(209,193,255,0.18);
  border-radius: 40px;
  padding: 8px 18px;
  backdrop-filter: blur(14px);
}

.nav button {
  background: none;
  border: none;
  color: var(--gl-lilac);
  cursor: pointer;
  font-size: 16px;
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.nav button:hover { background: rgba(255,131,0,0.18); color: var(--gl-orange); }

.slide-counter {
  font-family: var(--gl-font-body);
  font-size: 12px;
  color: rgba(209,193,255,0.65);
  min-width: 52px;
  text-align: center;
}

/* Jump-to dots */
.dot-nav {
  position: fixed;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 7px;
  z-index: 200;
}

.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: rgba(209,193,255,0.2);
  cursor: pointer;
  transition: all 0.2s;
}
.dot.active { background: var(--gl-orange); transform: scale(1.5); }
.dot:hover { background: var(--gl-lilac); }

/* ── Typography ───────────────────────────── */
h1 { font-family: var(--gl-font-headline); font-size: 58px; font-weight: 800; line-height: 1.0; }
h2 { font-family: var(--gl-font-headline); font-size: 28px; font-weight: 700; }
h3 { font-family: var(--gl-font-headline); font-size: 16px; font-weight: 700; }

.accent { color: var(--gl-orange); }
.lilac  { color: var(--gl-lilac); }

.section-label {
  font-family: var(--gl-font-headline);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--gl-lilac);
  margin-bottom: 6px;
  opacity: 0.8;
}

/* ── Cards ────────────────────────────────── */
.card {
  background: var(--gl-card-bg);
  border: var(--gl-card-border);
  border-radius: 12px;
  padding: 16px 18px;
}

.card-accent {
  background: rgba(255,131,0,0.07);
  border: 1.5px solid rgba(255,131,0,0.35);
  border-radius: 12px;
  padding: 16px 18px;
}

/* ── Stat callouts ────────────────────────── */
.stat { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.stat .value {
  font-family: var(--gl-font-headline);
  font-size: 26px;
  font-weight: 800;
  color: var(--gl-orange);
}
.stat .label { font-size: 13px; color: var(--gl-lilac); text-transform: uppercase; letter-spacing: 0.5px; text-align: center; }

/* ── Service badge ────────────────────────── */
.badge {
  display: inline-flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--gl-grape), var(--gl-orange));
  border-radius: 10px;
  font-family: var(--gl-font-headline);
  font-weight: 800;
  color: white;
  flex-shrink: 0;
}

/* ── Tags / pills ─────────────────────────── */
.tag {
  display: inline-block;
  padding: 4px 11px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  background: rgba(71,43,164,0.45);
  color: var(--gl-lilac);
  border: 1px solid rgba(209,193,255,0.18);
}

.pill-ops      { background: rgba(255,131,0,0.14); color: #FF8300; border: 1px solid rgba(255,131,0,0.28); }
.pill-infra    { background: rgba(71,43,164,0.28); color: var(--gl-lilac); border: 1px solid rgba(209,193,255,0.18); }
.pill-prod     { background: rgba(0,150,210,0.14); color: #60D0FF; border: 1px solid rgba(0,150,210,0.28); }
.pill-ancillary{ background: rgba(247,179,52,0.14); color: #F7B334; border: 1px solid rgba(247,179,52,0.28); }

/* ── List items ───────────────────────────── */
.li {
  display: flex; align-items: flex-start; gap: 7px;
  margin-bottom: 5px;
  font-size: 14px;
  line-height: 1.5;
  color: rgba(255,255,255,0.82);
}
.li::before { content: '›'; color: var(--gl-orange); font-weight: 700; flex-shrink: 0; margin-top: 0px; }

/* ── Internal stamp ───────────────────────── */
.stamp {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: #2C2B27;
  color: rgba(209,193,255,0.7);
  text-align: center;
  padding: 4px 12px;
  font-size: 10px;
  font-family: var(--gl-font-body);
  letter-spacing: 1px;
  z-index: 9999;
  opacity: 0.9;
}

/* ── Section-header slide ─────────────────── */
.section-hero {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
}

.hero-number {
  font-family: var(--gl-font-headline);
  font-size: 160px;
  font-weight: 800;
  color: rgba(255,255,255,0.04);
  line-height: 1;
  position: absolute;
  right: 48px;
  bottom: 60px;
}
</style>
</head>

const catMeta = {
  ops:       { label: 'Operations & Support',       pill: 'pill-ops'      },

function fmt(n) {
  return '$' + Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 });
}
function fmtFull(n) {
  return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function catPill(cat, extra) {
  const m = catMeta[cat];
  return `<span class="tag ${m.pill}" style="${extra||''}">${m.label}</span>`;
}

          `<span class="tag" style="font-size:11px;padding:4px 12px;">${c}</span>`).join('')}
      </div>
    </div>
    <div style="display:flex;gap:28px;padding-top:20px;border-top:1px solid rgba(209,193,255,0.12);">
      <div class="stat">
        <span class="value">${DATA.headcount.empCount}</span>
        <span class="label">Employees · ${DATA.headcount.contractors.ftes} Contractor FTEs</span>

      <div class="stat">
        <span class="value" style="font-size:20px;">${fmt(grandTotal)}</span>
        <span class="label">Total Run Rate</span>
      </div>
    </div>`;
}

// ================================================================
// SLIDE REGISTRY
// ================================================================
function buildSlides() {
  return [
    { id: 'title',      html: slideTitle()     },
    { id: 'overview',   html: slideOverview()  },
    { id: 'financials', html: slideFinancials() },
    ...DATA.services.map(s => ({ id: `svc-${s.id}`, html: slideService(s) })),
    { id: 'techstack',  html: slideTechStack() }
  ];
}

// ================================================================
// RENDER ENGINE
// ================================================================
let slides = [];
let current = 0;

function render() {
  slides = buildSlides();
  const deck = document.getElementById('deck');

  deck.innerHTML = slides.map((s, i) => `
    <div class="slide${i === 0 ? ' active' : ''}" data-i="${i}" data-id="${s.id}">
      ${s.html}
    </div>`).join('');

  document.getElementById('dotNav').innerHTML = slides.map((_, i) => `
    <div class="dot${i === 0 ? ' active' : ''}" onclick="goTo(${i})" title="Slide ${i+1}"></div>`).join('');

  document.getElementById('slideCounter').textContent = `1 / ${slides.length}`;
  updateProgress();
}

function goTo(idx) {
  if (idx < 0 || idx >= slides.length || idx === current) return;
  const all = document.querySelectorAll('.slide');
  const dots = document.querySelectorAll('.dot');

  all[current].classList.remove('active');
  if (idx > current) all[current].classList.add('exit-left');
  current = idx;
  all[current].classList.remove('exit-left');
  all[current].classList.add('active');

  setTimeout(() => all.forEach(s => { if (!s.classList.contains('active')) s.classList.remove('exit-left'); }), 360);

  dots.forEach((d, i) => d.classList.toggle('active', i === current));
  document.getElementById('slideCounter').textContent = `${current + 1} / ${slides.length}`;
  updateProgress();
}

function nextSlide() { goTo(current + 1); }
function prevSlide() { goTo(current - 1); }

function goToService(id) {
  const idx = slides.findIndex(s => s.id === `svc-${id}`);
  if (idx >= 0) goTo(idx);
}

function updateProgress() {
  document.getElementById('progressBar').style.width = ((current + 1) / slides.length * 100) + '%';
}

document.addEventListener('keydown', e => {
  if (['ArrowRight','ArrowDown',' '].includes(e.key)) { e.preventDefault(); nextSlide(); }
  if (['ArrowLeft','ArrowUp'].includes(e.key)) { e.preventDefault(); prevSlide(); }
  if (e.key === 'Home') goTo(0);
  if (e.key === 'End')  goTo(slides.length - 1);
});

// Touch/swipe support
let touchX = null;
document.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; });
document.addEventListener('touchend', e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 50) dx < 0 ? nextSlide() : prevSlide();
  touchX = null;
});

// Initialize
render();
</script>
